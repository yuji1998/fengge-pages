<style>

:root{
  --brand:#C8161E; --text:#1A1A1A; --sub:#8A8A8A; --line:#EDEDED;
  --bg:#F5F5F7; --card:#fff; --blue:#1E5AA8; --green:#0F8A5F;
  --cyan:#0E7490; --purple:#6D4AA8; --orange:#B45309;
  --radius:12px; --shadow:0 2px 8px rgba(0,0,0,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#E9EBEF;color:var(--text);display:flex;justify-content:center;
  align-items:flex-start;min-height:100vh;padding:20px 0;
}
/* ============ 手机外壳 ============ */
#phone{
  width:390px;height:844px;background:var(--bg);border-radius:44px;
  box-shadow:0 12px 48px rgba(0,0,0,.18);position:relative;overflow:hidden;
  border:10px solid #1a1a1c;display:flex;flex-direction:column;
}
#statusbar{
  height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:13px;font-weight:600;background:transparent;
  position:absolute;top:0;left:0;right:0;z-index:60;pointer-events:none;
}
#statusbar .right{display:flex;gap:5px;align-items:center;font-size:11px;}
#nav{
  height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;
  position:relative;font-size:17px;font-weight:600;z-index:50;margin-top:44px;
  background:transparent;color:var(--text);
}
#nav.dark{color:#fff;}
#nav .back{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;font-weight:400;
}
#nav .more{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;letter-spacing:1px;
}
#screen{
  flex:1;overflow-y:auto;overflow-x:hidden;position:relative;
  padding:0 0 12px;scrollbar-width:none;
}
#screen::-webkit-scrollbar{display:none;}

/* ============ Banner ============ */
.banner{
  margin:0 0 12px;padding:20px 20px 22px;color:#fff;position:relative;
  border-radius:0 0 20px 20px;
}
.banner h1{margin:0 0 6px;font-size:22px;font-weight:700;}
.banner p{margin:0;font-size:12.5px;opacity:.85;}

/* ============ 区块 ============ */
.sect-t{font-size:13px;color:var(--sub);margin:16px 16px 8px;font-weight:500;}
.wrap{padding:0 16px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.card{
  background:var(--card);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);cursor:pointer;position:relative;
  transition:transform .12s,box-shadow .12s;
}
.card:active{transform:scale(.97);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.card .ico{
  width:36px;height:36px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:19px;margin-bottom:9px;
}
.card .tt{font-size:14.5px;font-weight:600;margin-bottom:4px;color:var(--text);}
.card .ds{font-size:11.5px;color:var(--sub);line-height:1.4;}
.card.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:13px 14px;}
.card.wide .ico{margin:0;flex:0 0 36px;}
.card.wide .body{flex:1;min-width:0;}
.card.wide .tt{margin-bottom:2px;}

/* ============ 标签 ============ */
.tag{
  position:absolute;top:10px;right:10px;font-size:10.5px;padding:2px 7px;
  border-radius:8px;font-weight:500;line-height:1.5;
}
.tag.inline{position:static;display:inline-block;margin-left:6px;}
.tag.blue{background:#E8F0FB;color:#1E5AA8;}
.tag.green{background:#E8F5EE;color:#0F8A5F;}
.tag.orange{background:#FFF0E8;color:#D25A0F;}
.tag.gray{background:#F2F2F2;color:#8A8A8A;}
.tag.purple{background:#F0EEFA;color:#6D4AA8;}
.tag.red{background:#FDECEC;color:#C8161E;}

/* ============ 列表 ============ */
.list{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.row{
  display:flex;align-items:center;gap:12px;padding:14px 15px;
  border-bottom:1px solid var(--line);cursor:pointer;background:var(--card);
}
.row:last-child{border-bottom:none;}
.row:active{background:#FAFAFA;}
.row .ri{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 30px;}
.row .rb{flex:1;min-width:0;}
.row .rt{font-size:14.5px;font-weight:500;}
.row .rs{font-size:11.5px;color:var(--sub);margin-top:3px;}
.row .rr{font-size:13px;color:var(--sub);}
.row .arrow{color:#C8C8C8;font-size:15px;}

/* ============ 表单 ============ */
.form{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;}
.fitem{display:flex;align-items:center;min-height:50px;padding:12px 15px;border-bottom:1px solid var(--line);}
.fitem:last-child{border-bottom:none;}
.flabel{width:90px;flex:0 0 90px;font-size:14px;color:var(--text);}
.flabel em{color:#E0362F;font-style:normal;margin-right:2px;}
.fval{flex:1;font-size:14px;color:var(--text);text-align:right;}
.fval.ph{color:#C0C0C0;}
.finput{flex:1;border:none;outline:none;font-size:14px;text-align:right;font-family:inherit;background:transparent;color:var(--text);}
.finput::placeholder{color:#C0C0C0;}
.finput.left{text-align:left;}
.farrow{color:#C8C8C8;font-size:14px;margin-left:6px;}
.stepper{display:flex;align-items:center;gap:14px;}
.stepper button{
  width:26px;height:26px;border-radius:50%;border:1px solid #DCDCDC;background:#fff;
  font-size:16px;color:#666;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;
}
.stepper button:active{background:#F0F0F0;}
.stepper span{min-width:24px;text-align:center;font-size:15px;font-weight:600;}

/* ============ 时段选择 ============ */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px 15px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;}
.slot{
  padding:9px 4px;border-radius:9px;border:1px solid #E5E5E5;font-size:13px;
  text-align:center;cursor:pointer;background:#fff;transition:all .12s;
}
.slot.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:500;}
.slot.off{background:#F5F5F5;color:#C0C0C0;border-color:#F0F0F0;cursor:not-allowed;}
.slot:not(.off):active{transform:scale(.96);}

/* ============ 提示条 ============ */
.tip{
  display:flex;gap:8px;padding:11px 13px;border-radius:10px;font-size:12.5px;
  line-height:1.55;margin-bottom:12px;background:#FFF7E6;color:#8A5A00;
}
.tip.info{background:#E8F0FB;color:#1A4B85;}
.tip.green{background:#E8F5EE;color:#0A6847;}
.tip.warn{background:#FFF0E8;color:#A34400;}
.tip .ti{flex:0 0 auto;font-size:14px;}

/* ============ 底部按钮 ============ */
.submit{
  display:block;width:calc(100% - 32px);margin:8px 16px 16px;padding:14px;
  border:none;border-radius:24px;background:var(--brand);color:#fff;
  font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 14px rgba(200,22,30,.28);transition:transform .12s;
}
.submit:active{transform:scale(.98);}
.submit:disabled{background:#D5D5D5;box-shadow:none;cursor:not-allowed;color:#fff;}
.submit.grey{background:#F0F0F0;color:#9A9A9A;box-shadow:none;}

/* ============ 首页 ============ */
.home-hero{
  background:linear-gradient(135deg,#C8161E 0%,#A01018 100%);
  color:#fff;padding:16px 20px 26px;border-radius:0 0 20px 20px;
}
.home-hero .ttl{font-size:21px;font-weight:700;margin-bottom:5px;}
.home-hero .stl{font-size:12.5px;opacity:.85;}
.home-hero .meta{
  display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;
}
.home-hero .meta span{
  font-size:11px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:11px;
}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 16px;margin-top:-14px;}
.modcard{
  background:#fff;border-radius:14px;padding:15px 13px;box-shadow:0 3px 12px rgba(0,0,0,.07);
  cursor:pointer;position:relative;transition:transform .12s;
}
.modcard:active{transform:scale(.97);}
.modcard .mi{
  width:40px;height:40px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:21px;margin-bottom:10px;color:#fff;
}
.modcard .mt{font-size:15px;font-weight:600;margin-bottom:4px;}
.modcard .md{font-size:11.5px;color:var(--sub);}
.modcard .mc{
  position:absolute;top:13px;right:13px;font-size:10.5px;color:var(--sub);
  background:#F5F5F7;padding:2px 7px;border-radius:8px;
}

/* ============ 详情/统计 ============ */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.stat{background:#fff;border-radius:12px;padding:14px 10px;text-align:center;box-shadow:var(--shadow);}
.stat .n{font-size:22px;font-weight:700;color:var(--brand);line-height:1.2;}
.stat .l{font-size:11px;color:var(--sub);margin-top:4px;}
.bar-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
.bar-row .bl{width:66px;font-size:12.5px;color:#555;flex:0 0 66px;}
.bar-row .bt{flex:1;height:8px;background:#F0F0F0;border-radius:4px;overflow:hidden;}
.bar-row .bf{height:100%;border-radius:4px;}
.bar-row .bv{width:52px;text-align:right;font-size:12px;color:var(--sub);flex:0 0 52px;}

/* ============ 规格浮层 ============ */
#specbtn{
  position:absolute;right:12px;bottom:12px;z-index:80;
  width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.68);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.3);
}
#spec{
  position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;
  align-items:flex-end;border-radius:34px;
}
#spec.on{display:flex;}
#spec .box{
  background:#fff;width:100%;border-radius:18px 18px 34px 34px;padding:18px 18px 24px;
  max-height:78%;overflow-y:auto;
}
#spec h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;}
#spec .kv{display:flex;padding:8px 0;border-bottom:1px solid #F2F2F2;font-size:13px;}
#spec .kv:last-child{border-bottom:none;}
#spec .kk{width:88px;flex:0 0 88px;color:var(--sub);}
#spec .vv{flex:1;color:var(--text);line-height:1.5;word-break:break-all;}
#spec .close{
  margin-top:14px;width:100%;padding:12px;border:none;border-radius:22px;
  background:#F2F2F2;color:#555;font-size:15px;cursor:pointer;font-family:inherit;
}

/* ============ 内页顶部返回条 ============ */
.subline{padding:0 16px;margin-bottom:12px;}
.crumb{font-size:11.5px;color:var(--sub);margin-bottom:8px;}
.crumb b{color:var(--brand);font-weight:500;}

/* ============ 空态 ============ */
.empty{text-align:center;padding:48px 20px;color:#B0B0B0;font-size:13px;}
.empty .ei{font-size:38px;margin-bottom:12px;opacity:.5;}

/* ============ 底部固定操作区 ============ */
.footbar{padding:8px 0 4px;}
.copyright{text-align:center;font-size:11px;color:#B8B8B8;padding:14px 0 20px;}

/* ============ 首页说明条 ============ */
.demo-note{
  margin:14px 16px 0;padding:11px 13px;border-radius:10px;background:#E8F0FB;
  color:#1A4B85;font-size:12px;line-height:1.6;
}
.demo-note b{color:#0D3A6B;}

</style>
</head>

let ROUTE = '#/';
let hist = [];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function allPages(){ return P.modules.flatMap(m => m.pages.map(p => Object.assign({}, p, {_mod:m}))); }
function pageById(id){ return allPages().find(p => p.id === id); }

function tagClass(s){
  if(!s) return 'gray';
  if(/待上线|待审批|待处理|待执行|规划中/.test(s)) return 'orange';
  if(/已上线|已通过|已完成|已预约|已绑定|已同步|已打卡|已生成|已记录|已回复/.test(s)) return 'green';
  if(/驳回|异常/.test(s)) return 'red';
  if(/进行中|处理中|执行中/.test(s)) return 'blue';
  return 'gray';
}

function go(route){
  if(ROUTE !== route) hist.push(ROUTE);
  ROUTE = route;
  render();
  const sc = document.getElementById('screen'); if(sc) sc.scrollTop = 0;
}
function back(){
  ROUTE = hist.pop() || '#/';
  render();
  const sc = document.getElementById('screen'); if(sc) sc.scrollTop = 0;
}

function renderNav(cfg){
  const n = document.getElementById('nav');
  n.innerHTML =
    (cfg.back ? '<div class="back" onclick="back()">‹</div>' : '') +
    '<span>' + esc(cfg.title) + '</span>' +
    '<div class="more">⋯</div>';
}

function shade(hex, pct){
  const n = parseInt(hex.slice(1), 16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const f = 1 + pct/100;
  r=Math.max(0,Math.min(255,Math.round(r*f)));
  g=Math.max(0,Math.min(255,Math.round(g*f)));
  b=Math.max(0,Math.min(255,Math.round(b*f)));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function cardHtml(p, mod){
  const ico = ICON[p.id] || '📄';
  const wait = (p.status||[]).includes('待上线');

  return '<div class="card" onclick="go(\'#/' + p.id + '\')">' + tg +
    '<div class="ico" style="background:' + mod.color + '1A;color:' + mod.color + '">' + ico + '</div>' +
    '<div class="tt">' + esc(p.title) + '</div>' +
    '<div class="ds">' + esc(p.desc || '点击进入') + '</div></div>';
}

function row2(ico, title, sub, st, cls){
  return '<div class="row"><div class="ri" style="background:#F5F5F7">' + ico + '</div>' +
    '<div class="rb"><div class="rt">' + esc(title) + '</div><div class="rs">' + esc(sub) + '</div></div>' +
    '<span class="tag inline ' + cls + '">' + esc(st) + '</span></div>';

function render(){
  const screen = document.getElementById('screen');
  const parts = ROUTE.replace(/^#\//,'').split('/').filter(Boolean);
  const key = parts[0] || '';
  if(!key){ renderHome(screen); return; }
  const p = pageById(key);
  if(!p){
    renderNav({title:'未找到', back:true});
    screen.innerHTML = '<div class="empty"><div class="ei">🧭</div>页面不存在<br>#' + esc(key) + '</div>';
    return;
  }
  const mod = p._mod;
  renderNav({title:p.title, back:true});
  if(p.type === 'home') renderModHome(screen, mod, p);
  else if(p.type === 'form') renderForm(screen, p, mod);
  else if(p.type === 'list') renderList(screen, p, mod);
  else renderDetail(screen, p, mod);
}

      '<div class="list">' + row2('🪙','数币钱包','已开通 · 尾号 8823','已绑定','green') +
      row2('🪙','开通状态','需先对接总行智慧餐饮平台','已上线','green') + '</div>';
  } else if(p.id === 'data_hr_sync'){
    h += '<div class="list">' +
      row2('👥','组织架构','已同步 · 24个部门','已同步','green') +
      row2('👥','人员信息','已同步 · 386人','已同步','green') +
      row2('👥','用户授权体系','按部门/角色配置功能可见范围','已同步','green') + '</div>' +
      '<div style="font-size:11.5px;color:#8A8A8A;padding:10px 4px">说明：面向分行管理，据各功能模块建立清晰的用户授权体系。</div>';
  } else if(p.id === 'mgmt_stats'){ renderList(screen, p, m); return; }
  else {
    h += '<div class="empty"><div class="ei">' + (ICON[p.id]||'📄') + '</div>页面开发中</div>';
  }
  h += '</div><div class="copyright">' + esc(m.name) + ' · 由' + esc(m.owner) + '负责</div>';
  screen.innerHTML = h;
}

function toast(msg){
  const d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;z-index:200;max-width:76%;text-align:center;line-height:1.5';
  document.getElementById('phone').appendChild(d);
  setTimeout(() => d.remove(), 1800);
}

function openSpec(){
  const parts = ROUTE.replace(/^#\//,'').split('/').filter(Boolean);
  const p = pageById(parts[0]);
  const box = document.getElementById('specbox');
  if(!p){
    box.innerHTML = '<h3>📘 平台规格</h3>' +
      kv('平台', P.platform.name) + kv('单位', P.platform.org) +
      kv('入口渠道', P.platform.endpoints.join('、')) +
      kv('模块数', P.modules.length + ' 个') + kv('功能点', '32 项') +
      kv('原型页面', allPages().length + ' 页');
  } else {
    const m = p._mod;
    box.innerHTML = '<h3>📘 ' + esc(p.title) + '</h3>' +
      kv('模块', m.name) + kv('路由', '#/' + p.id) +
      kv('页面类型', ({home:'模块首页',form:'表单页',list:'列表页',detail:'详情页'})[p.type] || p.type) +
      kv('端', '手机端') + kv('服务对象', p.audience || '全体员工') +
      kv('牵头/协同', m.owner) + kv('优先级', m.priority) +
      kv('状态', (p.status||[]).join(' / ') || '—') +
      kv('依赖', p.deps || '—') + kv('对接系统', p.systems || '—') +
      kv('字段', (p.fields||[]).map(f => typeof f==='string'?f:(f.label||f.name)).join('、') || '—') +
      (p.note ? kv('备注', p.note) : '');
  }
  document.getElementById('spec').classList.add('on');
}
function kv(k, v){
  return '<div class="kv"><div class="kk">' + esc(k) + '</div><div class="vv">' + esc(v) + '</div></div>';
}
function closeSpec(){ document.getElementById('spec').classList.remove('on'); }

window.addEventListener('hashchange', () => {
  const r = location.hash || '#/';
  if(r !== ROUTE){ ROUTE = r; render(); }
});
document.addEventListener('DOMContentLoaded', () => {
  ROUTE = location.hash || '#/';
  render();
});

</script>
</body>
</html>
