<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>苏州行程演示</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;overflow:hidden;background:#070d18;}
  #app{display:flex;height:100%;}

  /* ===== 地图区 ===== */
  #mapBox{flex:1;position:relative;min-width:0;}
  #map{width:100%;height:100%;background:#0a1220;}
  .leaflet-tile-pane{filter:saturate(.75) brightness(.82) contrast(1.05);}
  #mapBox::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:400;
    background:radial-gradient(ellipse at center,rgba(10,18,32,0) 45%,rgba(7,13,24,.55) 100%);}

  /* ===== 工具栏 ===== */
  #toolbar{position:absolute;top:12px;left:12px;z-index:1000;display:flex;gap:8px;flex-wrap:wrap;}
  .btn{padding:9px 15px;border:1px solid rgba(79,195,247,.35);border-radius:9px;
       background:rgba(12,22,40,.82);backdrop-filter:blur(10px);color:#8fd4f5;cursor:pointer;
       font-size:13px;font-family:inherit;font-weight:500;letter-spacing:.3px;
       transition:all .22s;box-shadow:0 3px 14px rgba(0,0,0,.4);}
  .btn:hover{border-color:rgba(79,195,247,.8);color:#fff;box-shadow:0 4px 18px rgba(79,195,247,.3);}
  .btn.active{background:linear-gradient(135deg,#1976d2,#4fc3f7);border-color:transparent;color:#fff;
              box-shadow:0 4px 20px rgba(79,195,247,.5);}

  /* ===== 图例 ===== */
  #legend{position:absolute;bottom:22px;left:12px;z-index:1000;
          background:rgba(12,22,40,.85);backdrop-filter:blur(10px);
          border:1px solid rgba(79,195,247,.25);border-radius:11px;padding:11px 15px;
          box-shadow:0 6px 24px rgba(0,0,0,.5);}
  #legend .lg-t{font-size:10px;color:#5a7a9a;letter-spacing:1.5px;margin-bottom:8px;font-weight:600;}
  #legend .lg-r{display:flex;align-items:center;gap:9px;margin-top:6px;font-size:12.5px;color:#c8e4f5;}
  #legend .lg-r b{color:#4fc3f7;font-weight:600;margin-left:auto;padding-left:14px;}
  .lg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  /* ===== 侧栏 ===== */
  #panel{width:372px;background:linear-gradient(170deg,#0c1626,#080f1c);
         border-left:1px solid rgba(79,195,247,.14);overflow-y:auto;flex-shrink:0;
         padding:20px 18px 28px;scrollbar-width:thin;scrollbar-color:#1d3a5c transparent;}
  #panel::-webkit-scrollbar{width:5px;}
  #panel::-webkit-scrollbar-thumb{background:#1d3a5c;border-radius:3px;}
  .p-head{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(79,195,247,.13);}
  .p-head h1{font-size:19px;font-weight:700;letter-spacing:.5px;
    background:linear-gradient(92deg,#4fc3f7,#7ee8fa 55%,#4fc3f7);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
  .p-head .sub{font-size:11.5px;color:#5a7a9a;letter-spacing:.6px;}

  /* 时间轴 */
  .timeline{position:relative;padding-left:22px;}
  .timeline::before{content:"";position:absolute;left:6px;top:14px;bottom:14px;width:2px;border-radius:1px;
    background:linear-gradient(180deg,#4fc3f7,rgba(79,195,247,.5) 45%,rgba(230,126,34,.7));}
  .tl-item{position:relative;margin-bottom:11px;animation:fadeUp .45s backwards;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:translateY(0);}}
  .tl-item::before{content:"";position:absolute;left:-21px;top:15px;width:12px;height:12px;border-radius:50%;
    background:#0c1626;border:2.5px solid #4fc3f7;box-shadow:0 0 10px rgba(79,195,247,.7);z-index:1;}
  .tl-item.end::before{border-color:#ff9f43;box-shadow:0 0 12px rgba(255,159,67,.8);}
  .tl-item.seg::before{left:-19px;top:19px;width:8px;height:8px;border-radius:2px;border-color:#f5a623;
    box-shadow:0 0 8px rgba(245,166,35,.6);}
  /* 午间休整分隔卡 */
  .tl-item.break{margin:14px 0;}
  .tl-item.break::before{left:-20px;top:16px;width:12px;height:12px;border-radius:50%;
    background:#0c1626;border:2.5px dashed #ffb066;box-shadow:0 0 10px rgba(255,176,102,.55);}
  .break-card{background:linear-gradient(150deg,rgba(38,26,14,.72),rgba(14,18,28,.92));
    border:1px dashed rgba(255,176,102,.42);}
  .break-card .name{color:#ffc98a;}
  .card{background:linear-gradient(150deg,rgba(21,38,63,.92),rgba(12,22,40,.92));
        border:1px solid rgba(79,195,247,.16);border-radius:11px;padding:12px 14px;
        transition:border-color .22s,transform .22s;}
  .card:hover{border-color:rgba(79,195,247,.42);transform:translateX(3px);}
  .card .name{font-size:14px;font-weight:600;color:#e3f2fd;}
  .card .tag{display:inline-block;font-size:10px;padding:2px 9px;margin-left:7px;border-radius:9px;
    background:rgba(79,195,247,.16);color:#7dd8f8;vertical-align:1.5px;font-weight:600;letter-spacing:.4px;}
  .card .tag.end{background:rgba(255,159,67,.18);color:#ffb066;}
/* 一键导航按钮 */
.nav-btn{display:inline-block;margin-top:9px;margin-right:7px;padding:6px 13px;
    font-size:12.5px;font-weight:600;border-radius:8px;text-decoration:none;
    background:linear-gradient(140deg,rgba(79,195,247,.22),rgba(25,118,210,.28));
    border:1px solid rgba(79,195,247,.5);color:#9fe4ff;
    transition:transform .18s,background .18s,box-shadow .18s;cursor:pointer;}
.nav-btn:hover{transform:translateY(-1px);background:linear-gradient(140deg,rgba(79,195,247,.42),rgba(25,118,210,.5));
    box-shadow:0 4px 14px rgba(79,195,247,.32);color:#fff;}
.nav-btn:active{transform:translateY(0);}
.nav-btn.amap{border-color:rgba(79,195,247,.5);}
.nav-btn.baidu{border-color:rgba(255,176,102,.5);color:#ffd0a3;
    background:linear-gradient(140deg,rgba(255,159,67,.2),rgba(230,126,34,.26));}
.nav-btn.baidu:hover{background:linear-gradient(140deg,rgba(255,159,67,.4),rgba(230,126,34,.5));
    box-shadow:0 4px 14px rgba(255,159,67,.3);color:#fff;}
.nav-addr{font-size:11.5px;color:#7f97b5;margin-top:5px;line-height:1.5;}
  .times{font-size:12px;color:#8ba8c4;margin-top:7px;line-height:1.85;}
  .times b{color:#4fc3f7;font-weight:600;font-variant-numeric:tabular-nums;}
  .seg-card{background:linear-gradient(150deg,rgba(28,22,14,.7),rgba(14,18,28,.92));}
  .seg-card .name{font-size:12.5px;color:#ffc98a;font-weight:500;}
  .seg-card .route-name{font-size:11.5px;color:#7a8ba3;margin-top:5px;line-height:1.6;}
  .stat-line{font-size:12px;color:#ffb066;margin-top:7px;font-weight:600;font-variant-numeric:tabular-nums;}

  /* 进度条 */
  .prog-wrap{margin:14px 0 18px;}
  .prog-bar{height:5px;background:rgba(79,195,247,.12);border-radius:3px;overflow:hidden;position:relative;}
  .prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#1976d2,#4fc3f7,#7ee8fa);
    box-shadow:0 0 12px rgba(79,195,247,.75);transition:width .4s;}
  .prog-lbl{display:flex;justify-content:space-between;font-size:10px;color:#5a7a9a;margin-top:6px;letter-spacing:.5px;}

  .loading,.error{padding:14px;font-size:13px;color:#5a7a9a;text-align:center;}
  .error{color:#ff8a80;}

  /* Toast */
  #toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(14px);
    background:rgba(12,22,40,.96);border:1px solid rgba(79,195,247,.4);color:#c8e4f5;
    padding:11px 24px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;
    transition:all .3s;z-index:9999;box-shadow:0 8px 28px rgba(0,0,0,.6);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 途径点标记 */
  .pin{position:relative;display:flex;align-items:center;justify-content:center;
       width:30px;height:30px;border-radius:50%;font-size:13px;font-weight:700;color:#fff;
       background:linear-gradient(140deg,#1976d2,#4fc3f7);border:2.5px solid #fff;
       box-shadow:0 3px 12px rgba(0,0,0,.55),0 0 16px rgba(79,195,247,.6);z-index:2;}
  .pin.end{background:linear-gradient(140deg,#e67e22,#ffb066);box-shadow:0 3px 12px rgba(0,0,0,.55),0 0 16px rgba(255,159,67,.6);}
  .pin .halo{position:absolute;inset:-2px;border-radius:50%;border:2px solid #4fc3f7;
             animation:pulse 2.1s ease-out infinite;pointer-events:none;}
  .pin.end .halo{border-color:#ff9f43;}
  @keyframes pulse{0%{transform:scale(1);opacity:.85;}100%{transform:scale(2.5);opacity:0;}}
  .leaflet-tooltip{background:rgba(12,22,40,.94)!important;border:1px solid rgba(79,195,247,.35)!important;
    color:#c8e4f5!important;font-size:12px!important;border-radius:7px!important;
    box-shadow:0 4px 16px rgba(0,0,0,.5)!important;padding:5px 10px!important;}
  .leaflet-tooltip-top:before{border-top-color:rgba(79,195,247,.35)!important;}
  .leaflet-control-attribution{background:rgba(12,22,40,.7)!important;color:#4a6a8a!important;font-size:10px!important;}
  .leaflet-control-attribution a{color:#6a9aba!important;}
  .leaflet-bar a{background:rgba(12,22,40,.9)!important;color:#8fd4f5!important;border-color:rgba(79,195,247,.25)!important;}
  .leaflet-bar a:hover{background:#1976d2!important;color:#fff!important;}

  /* ===== 手机竖屏 ===== */
  @media (max-width:820px){
    #app{flex-direction:column;}
    #mapBox{height:52%;flex:none;}
    #panel{width:100%;height:48%;border-left:none;border-top:1px solid rgba(79,195,247,.14);padding:15px 14px 22px;}
    #toolbar{top:9px;left:9px;gap:6px;}
    .btn{padding:7px 11px;font-size:11.5px;}
    #legend{bottom:12px;left:9px;padding:8px 11px;}
    #legend .lg-r{font-size:11px;margin-top:4px;}
    #legend .lg-t{font-size:9px;margin-bottom:5px;}
    .p-head h1{font-size:16px;}
    .p-head{margin-bottom:14px;padding-bottom:12px;}
    .card{padding:10px 12px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="mapBox">
    <div id="map"></div>
    <div id="toolbar">
      <button class="btn active" id="btnRoad" onclick="setBase('road')">路网图</button>
      <button class="btn" id="btnSat" onclick="setBase('sat')">卫星图</button>
      <button class="btn active" id="btnReplay" onclick="toggleReplay()">⏸ 播放中</button>
      <button class="btn" onclick="copyLink()">📋 复制链接</button>
    </div>
    <div id="legend">
      <div class="lg-t">TRIP DATA</div>
      <div class="lg-r"><span class="lg-dot" style="background:#4fc3f7;box-shadow:0 0 8px #4fc3f7"></span>总里程<b id="lgDist">—</b></div>
      <div class="lg-r"><span class="lg-dot" style="background:#ff9f43;box-shadow:0 0 8px #ff9f43"></span>行车时长<b id="lgDur">—</b></div>
    </div>
  </div>
  <div id="panel">
    <div class="p-head">
      <h1>苏州行程演示</h1>
      <div class="sub">2026-09-16（周三）· 上午 分行→黄桥支行→东湖大郡支行 ｜ 下午 分行→姑苏区人民政府</div>
    </div>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-lbl"><span id="progPos">起点</span><span id="progPct">0%</span></div>
    </div>
    <div class="timeline" id="timeline"><div class="loading">正在加载路线数据…</div></div>
  </div>
</div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ================= 配置 ================= */
const DEPART_MIN = 9 * 60 + 30;   // 上午出发 09:30（2026-09-16 行程）
const PM_DEPART_MIN = 16 * 60;    // 下午出发 16:00（午间休整后重新起算）
const BREAK_AFTER_SEG = 3;        // 第4个点(上午返回分行)之后进入午间休整
const DEFAULT_STAY = 0;           // 默认停留(分钟)
const STAY_OVERRIDE = {           // 各点位停留时长（分钟）
  '黄桥支行': 30,                 // 网点调研（30分钟）
  '东湖大郡支行': 30,             // 网点调研（30分钟）
  '返回分行': 0,
  '姑苏区人民政府': 40            // 走访会谈（40分钟）
};

let map, roadLayer, satLayer, routeLayers = [], comet = null;
let ROUTE = null, rafId = null, t0 = 0, paused = false, progress = 0;
let FULL = [], CUM = [], TRIP_DIST = 0;

/* ================= 地图 ================= */
map = L.map('map',{zoomControl:false,attributionControl:true}).setView([31.322,120.7255],13);
L.control.zoom({position:'bottomright'}).addTo(map);

const TILE_ROAD='https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}';
const TILE_SAT ='https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}';
const TILE_LABEL='https://webst0{s}.is.autonavi.com/appmaptile?style=8&ltype=11&x={x}&y={y}&z={z}';

roadLayer = L.tileLayer(TILE_ROAD,{subdomains:['1','2','3','4'],maxZoom:18,attribution:'© 高德地图'});
roadLayer.addTo(map);

function setBase(mode){
  document.getElementById('btnRoad').classList.toggle('active',mode==='road');
  document.getElementById('btnSat').classList.toggle('active',mode==='sat');
  if(mode==='sat'){
    if(roadLayer)map.removeLayer(roadLayer);
    if(!satLayer)satLayer=L.layerGroup([L.tileLayer(TILE_SAT,{subdomains:['1','2','3','4'],maxZoom:18}),
                                        L.tileLayer(TILE_LABEL,{subdomains:['1','2','3','4'],maxZoom:18})]);
    satLayer.addTo(map);
  }else{
    if(satLayer)map.removeLayer(satLayer);
    if(roadLayer)roadLayer.addTo(map);
  }
}

/* ================= 工具 ================= */
/* 一键导航：高德 / 百度 双端唤起（手机点开直达导航，PC打开网页版） */
function navUrl(kind, pt){
  const lng=pt.lnglat[0], lat=pt.lnglat[1];
  const nm=pt.name||'';
  if(kind==='amap'){
    /* dev=0 有坐标用坐标；URI 规范 lat,lng,name */
    return 'https://uri.amap.com/navigation?to='+lng+','+lat+','+encodeURIComponent(nm)+
           '&mode=car&policy=1&src=fengge&coordinate=gaode&callnative=1';
  }
  if(kind==='amapmark'){
    return 'https://uri.amap.com/marker?position='+lng+','+lat+'&name='+encodeURIComponent(nm)+
           '&coordinate=gaode&callnative=1';
  }
  if(kind==='baidu'){
    /* 百度：坐标用 marker 更准；地址名当备选 */
    return 'https://api.map.baidu.com/direction?destination=latlng:'+lat+','+lng+'|name:'+
           encodeURIComponent(nm)+'&mode=driving&region=苏州&output=html&src=fengge';
  }
  return '#';
}
function fmtTime(min){const h=Math.floor(min/60)%24,m=Math.round(min%60);return (h<10?'0'+h:h)+':'+(m<10?'0'+m:m);}
function fmtDur(sec){const m=Math.round(sec/60);return m>=60?(Math.floor(m/60)+'小时'+(m%60?(m%60)+'分':'')):m+'分钟';}
function fmtDist(m){return (m/1000).toFixed(1)+' 公里';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
function copyLink(){
  const url=location.href;
  const done=()=>toast('✅ 链接已复制，可直接分享');
  const fb=()=>{const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动复制');}ta.remove();};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(url).then(done,fb);else fb();
}

/* ================= 勾选：流光层（canvas 拖尾彗星） ================= */
const FlowLayer = L.Layer.extend({
  initialize(){ this._canvas=null; this._trail=[]; this._rings=[]; this._pos=0; this._head=[0,0]; },
  onAdd(map){
    this._map=map;
    const c=this._canvas=L.DomUtil.create('canvas','leaflet-flow-layer');
    c.style.cssText='position:absolute;pointer-events:none;z-index:450;';
    map.getPanes().overlayPane.appendChild(c);
    map.on('move zoom viewreset resize', this._reset, this);
    this._reset();
  },
  onRemove(map){
    map.getPanes().overlayPane.removeChild(this._canvas);
    map.off('move zoom viewreset resize', this._reset, this);
  },
  _reset(){
    const size=this._map.getSize(), tl=this._map.containerPointToLayerPoint([0,0]);
    L.DomUtil.setPosition(this._canvas,tl);
    this._canvas.width=size.x; this._canvas.height=size.y;
    this._canvas.style.width=size.x+'px'; this._canvas.style.height=size.y+'px';
  },
  setProgress(p, latlngs){
    this._pos=p;
    const n=latlngs.length; if(n<2)return;
    const f=p*(n-1), i=Math.floor(f), frac=f-i;
    const a=latlngs[Math.min(i,n-1)], b=latlngs[Math.min(i+1,n-1)];
    this._head=[a[0]+(b[0]-a[0])*frac, a[1]+(b[1]-a[1])*frac];
    this._trail.push(this._head.slice());
    if(this._trail.length>52)this._trail.shift();
  },
  burst(){ this._rings.push({r:0,a:1}); if(this._rings.length>6)this._rings.shift(); },
  draw(){
    const c=this._canvas; if(!c)return;
    const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
    const P=pt=>{const q=this._map.latLngToContainerPoint(pt);return [q.x,q.y];};

    /* 拖尾 */
    const T=this._trail;
    for(let i=0;i<T.length;i++){
      const [x,y]=P(T[i]);
      const k=i/(T.length-1||1), size=2.2+k*4.6, al=0.09+k*k*0.62;
      const g=ctx.createRadialGradient(x,y,0,x,y,size*2.6);
      g.addColorStop(0,`rgba(126,232,250,${al})`);
      g.addColorStop(0.45,`rgba(79,195,247,${al*0.65})`);
      g.addColorStop(1,'rgba(25,118,210,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,size*2.6,0,6.2832); ctx.fill();
    }

    /* 彗核 */
    if(T.length){
      const [hx,hy]=P(this._head);
      const core=ctx.createRadialGradient(hx,hy,0,hx,hy,17);
      core.addColorStop(0,'rgba(255,255,255,1)');
      core.addColorStop(0.25,'rgba(180,245,255,.95)');
      core.addColorStop(0.6,'rgba(79,195,247,.5)');
      core.addColorStop(1,'rgba(25,118,210,0)');
      ctx.fillStyle=core; ctx.beginPath(); ctx.arc(hx,hy,17,0,6.2832); ctx.fill();
    }

    /* 到站脉冲 */
    for(let i=this._rings.length-1;i>=0;i--){
      const rg=this._rings[i];
      const pt=this._waypoints&&this._waypoints[rg.wi];
      if(!pt){this._rings.splice(i,1);continue;}
      const [x,y]=P(pt);
      ctx.strokeStyle=`rgba(126,232,250,${rg.a})`; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.arc(x,y,rg.r,0,6.2832); ctx.stroke();
      rg.r+=1.5; rg.a-=0.022;
      if(rg.a<=0)this._rings.splice(i,1);
    }
  }
});

/* ================= 加载数据 ================= */
fetch('route_data.json').then(r=>r.json()).then(d=>{ROUTE=d;render();})
 .catch(e=>{document.getElementById('timeline').innerHTML=
   '<div class="error">路线数据加载失败：'+e.message+'<br>请确认 route_data.json 与页面同目录。</div>';});

function render(){
  const {points,segments,total_distance,total_duration}=ROUTE;

  /* 时间推算（支持午间休整：休整点之后从下午出发时间重新起算） */
  let clock=DEPART_MIN;
  points.forEach((pt,i)=>{
    const stay=STAY_OVERRIDE[pt.name]!=null?STAY_OVERRIDE[pt.name]:DEFAULT_STAY;
    if(i===0){pt._arrive=null;pt._leave=clock;pt._stay=null;}
    else{
      if(i===BREAK_AFTER_SEG+1){clock=PM_DEPART_MIN;pt._afterBreak=true;}
      const sg=segments[i-1];
      pt._arrive=clock+Math.round((sg?sg.duration:0)/60);
      pt._leave=pt._arrive+stay;pt._stay=stay;clock=pt._leave;
    }
  });

  /* 合并全轨迹 */
  FULL=[]; segments.forEach(s=>s.polyline.forEach(p=>FULL.push([p[1],p[0]])));
  CUM=[]; let acc=0; CUM.push(0);
  segments.forEach(s=>{
    const n=s.polyline.length;
    for(let j=1;j<n;j++){
      const a=s.polyline[j-1],b=s.polyline[j];
      acc+=Math.hypot((b[0]-a[0])*102000,(b[1]-a[1])*87000);
      CUM.push(acc);
    }
  });
  TRIP_DIST=acc||total_distance;

  /* 路线：三层描边发光 */
  routeLayers.forEach(l=>map.removeLayer(l)); routeLayers=[];
  segments.forEach(seg=>{
    const ll=seg.polyline.map(p=>[p[1],p[0]]);
    routeLayers.push(
      L.polyline(ll,{color:'#1976d2',weight:16,opacity:.16,lineJoin:'round',lineCap:'round'}).addTo(map),
      L.polyline(ll,{color:'#4fc3f7',weight:7,opacity:.34,lineJoin:'round',lineCap:'round'}).addTo(map),
      L.polyline(ll,{color:'#b3ecff',weight:2.4,opacity:.95,lineJoin:'round',lineCap:'round'}).addTo(map)
    );
  });

  /* 图钉标记 */
  points.forEach((pt,i)=>{
    const isEnd=i===points.length-1;
    const html='<div class="pin'+(isEnd?' end':'')+'"><span class="halo"></span>'+(i+1)+'</div>';
    const icon=L.divIcon({className:'',html,iconSize:[30,30],iconAnchor:[15,15]});
    routeLayers.push(L.marker([pt.lnglat[1],pt.lnglat[0]],{icon,zIndexOffset:500})
      .addTo(map).bindPopup('<b>'+(i+1)+'. '+pt.name+'</b>'+
        (pt.addr?'<br><span style="color:#888;font-size:12px">'+pt.addr+'</span>':'')+
        '<div style="margin-top:8px">'+
        '<a href="'+navUrl('amap',pt)+'" target="_blank" rel="noopener" '+
          'style="display:inline-block;margin-right:6px;padding:4px 10px;border-radius:6px;'+
          'background:#1976d2;color:#fff;text-decoration:none;font-size:12.5px">高德导航</a>'+
        '<a href="'+navUrl('baidu',pt)+'" target="_blank" rel="noopener" '+
          'style="display:inline-block;padding:4px 10px;border-radius:6px;'+
          'background:#e67e22;color:#fff;text-decoration:none;font-size:12.5px">百度导航</a></div>')
      .bindTooltip((i+1)+'. '+pt.name,{direction:'top',offset:[0,-16]}));
  });

  const all=FULL.slice();
  if(all.length)map.fitBounds(L.latLngBounds(all),{padding:[70,70]});

  /* 流光层 */
  if(comet)map.removeLayer(comet);
  comet=new FlowLayer(); comet._waypoints=points.map(p=>[p.lnglat[1],p.lnglat[0]]);
  comet.addTo(map);

  /* 图例 */
  document.getElementById('lgDist').textContent=fmtDist(total_distance);
  document.getElementById('lgDur').textContent=fmtDur(total_duration);

  /* 时间轴 */
  const tl=document.getElementById('timeline'); tl.innerHTML='';
  points.forEach((pt,i)=>{
    const isEnd=i===points.length-1;
    let times='';
    if(i===0)times='🕘 出发　<b>'+fmtTime(pt._leave)+'</b>';
    else{
      times='🕓 到达　<b>'+fmtTime(pt._arrive)+'</b>　·　🕕 离开　<b>'+fmtTime(pt._leave)+'</b>';
      if(pt._stay)times+='<br>⏸ 停留 '+pt._stay+' 分钟';
    }
    const d=document.createElement('div');
    d.className='tl-item'+(isEnd?' end':'');
    d.style.animationDelay=(i*0.08)+'s';
    /* 一键导航按钮（起点也提供，便于反向查看） */
    let navBtns='<div class="nav-actions">'+
      '<a class="nav-btn amap" href="'+navUrl('amap',pt)+'" target="_blank" rel="noopener" '+
        'title="用高德地图导航到该点">🧭 高德导航</a>'+
      '<a class="nav-btn baidu" href="'+navUrl('baidu',pt)+'" target="_blank" rel="noopener" '+
        'title="用百度地图导航到该点">🧭 百度导航</a>'+
      '</div>';
    if(pt.addr)navBtns+='<div class="nav-addr">📍 '+pt.addr+'</div>';
    d.innerHTML='<div class="card"><span class="name">'+(i+1)+'. '+pt.name+'</span>'+
      '<span class="tag'+(isEnd?' end':'')+'">'+(i===0?'起点':(isEnd?'终点':'途经'))+'</span>'+
      '<div class="times">'+times+'</div>'+navBtns+'</div>';
    tl.appendChild(d);

    /* 午间休整分隔卡 */
    if(i===BREAK_AFTER_SEG){
      const b=document.createElement('div');
      b.className='tl-item break';
      b.style.animationDelay=((i+0.4)*0.08)+'s';
      b.innerHTML='<div class="card break-card"><span class="name">🏢 返回分行 · 午间休整</span>'+'<div class="times">上午调研结束，回分行休整；下午 <b>'+fmtTime(PM_DEPART_MIN)+'</b> 再次出发</div></div>';
      tl.appendChild(b);
    }

    if(i<segments.length){
      const sg=segments[i];
      const roads=sg.steps.filter(s=>s.road).map(s=>s.road).filter((v,j,a)=>a.indexOf(v)===j).slice(0,3).join(' → ');
      const e=document.createElement('div');
      e.className='tl-item seg'; e.style.animationDelay=((i+0.5)*0.08)+'s';
      e.innerHTML='<div class="card seg-card"><span class="name">🚗 行驶段 '+(i+1)+'</span>'+
        (roads?'<div class="route-name">'+roads+'</div>':'')+
        '<div class="stat-line">⏱ 行车 '+fmtDur(sg.duration)+'　·　📏 '+fmtDist(sg.distance)+'</div></div>';
      tl.appendChild(e);
    }
  });
  const s=document.createElement('div');
  s.className='tl-item'; s.style.animationDelay=((points.length*2-1)*0.08)+'s';
  s.innerHTML='<div class="card"><span class="name">🧾 全程合计</span>'+
    '<div class="stat-line">⏱ '+fmtDur(total_duration)+'　·　📏 '+fmtDist(total_distance)+'</div>'+
    '<div class="times">含停留约 '+fmtTime(clock)+' 结束</div></div>';
  tl.appendChild(s);

  startAnimation();
}

/* ================= 动画循环 ================= */
const SPEED=0.000135;   // 进度/毫秒
function startAnimation(){
  if(rafId)cancelAnimationFrame(rafId);
  t0=performance.now()-progress/SPEED;
  keep();
}
function keep(){
  rafId=requestAnimationFrame(keep);
  const now=performance.now();
  if(!paused){
    progress=(now-t0)*SPEED;
    if(progress>=1){progress=0;t0=now;comet._trail.length=0;}
  }
  if(!FULL.length)return;
  comet.setProgress(progress,FULL);
  comet.draw();
  updateHUD();
}

/* 到站脉冲：按累计里程判断 */
let lastWi=-1;
function updateHUD(){
  const el=document.getElementById('progFill'), pos=document.getElementById('progPos'), pct=document.getElementById('progPct');
  if(!el||!CUM.length)return;
  const d=progress*TRIP_DIST;
  el.style.width=(progress*100).toFixed(1)+'%';
  pct.textContent=(progress*100).toFixed(0)+'%';
  let wi=0;
  for(let i=0;i<CUM.length;i++){ if(CUM[i]<=d)wi=i; else break; }
  // 找最近的点名
  let acc=0,label='起点';
  const nSeg=(ROUTE&&ROUTE.segments)?ROUTE.segments.length:0;
  let idx=0;
  if(nSeg){
    let cum=0;
    for(let i=0;i<nSeg;i++){
      if(d<=cum+ROUTE.segments[i].distance){idx=i;break;}
      cum+=ROUTE.segments[i].distance;idx=i+1;
    }
  }
  const pts=ROUTE.points;
  if(idx<=0)label='前往 '+pts[1].name;
  else if(idx>=nSeg)label='抵达 '+pts[pts.length-1].name;
  else label='在 '+pts[idx].name.replace(/\s.*$/,'');
  pos.textContent=label;
}

function toggleReplay(){
  paused=!paused;
  const b=document.getElementById('btnReplay');
  b.textContent=paused?'▶ 继续':'⏸ 播放中';
  b.classList.toggle('active',!paused);
  if(!paused){t0=performance.now()-progress/SPEED;}
}
</script>
